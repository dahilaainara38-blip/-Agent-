<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WECHATILINK Agent</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1e2823;
            --muted: #68766e;
            --line: #d9e0d9;
            --surface: #ffffff;
            --canvas: #f3f6f2;
            --green: #236c4c;
            --green-dark: #174934;
            --teal: #0b6f75;
            --amber: #a45c00;
            --red: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--canvas);
            color: var(--ink);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 15px;
            letter-spacing: 0;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 64px;
            padding: 10px 20px;
            background: var(--green-dark);
            color: #fff;
            border-bottom: 3px solid #d8a13a;
        }

        .brand {
            display: flex;
            flex-direction: column;
            min-width: 0;
            margin-right: auto;
        }

        .brand strong {
            font-size: 18px;
            line-height: 1.2;
        }

        .brand span {
            color: #c9dbd0;
            font-size: 12px;
            line-height: 1.3;
            white-space: nowrap;
        }

        .top-select {
            width: min(260px, 34vw);
            min-height: 36px;
            padding: 5px 8px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 6px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 17px;
            line-height: 1;
        }

        .icon-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .workspace {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr) 310px;
            gap: 14px;
            width: min(1500px, calc(100% - 28px));
            margin: 14px auto 20px;
        }

        .panel {
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            background: #ebf1ea;
            font-weight: 700;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .subject-list {
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 128px);
            overflow: auto;
            padding: 8px;
        }

        .subject {
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr);
            gap: 9px;
            width: 100%;
            min-height: 56px;
            padding: 8px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            text-align: left;
            cursor: pointer;
        }

        .subject:hover {
            background: #edf3ee;
        }

        .subject.active {
            background: #e2f0e7;
            box-shadow: inset 3px 0 0 var(--green);
        }

        .subject-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #dcebe1;
            color: var(--green);
            font-weight: 700;
        }

        .subject-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 700;
        }

        .subject-meta {
            overflow: hidden;
            color: var(--muted);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .subject-row {
            position: relative;
        }

        .subject-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            display: none;
            width: 22px;
            height: 22px;
            border: 0;
            border-radius: 4px;
            background: #f6d8d8;
            color: #a33;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }

        .subject-row:hover .subject-remove {
            display: block;
        }

        .subject-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
        }

        .subject-form select,
        .subject-form input {
            padding: 6px 8px;
            border: 1px solid #d5e2d8;
            border-radius: 6px;
            font-size: 13px;
        }

        .add-subject {
            margin: 4px 8px 8px;
            padding: 8px;
            border: 1px dashed #b7cec0;
            border-radius: 6px;
            background: transparent;
            color: var(--green);
            cursor: pointer;
        }

        .record-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow: auto;
            padding: 8px;
        }

        .record-item {
            border-left: 3px solid #dcebe1;
            padding: 4px 8px;
        }

        .record-type {
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
        }

        .record-content {
            font-size: 13px;
        }

        .record-time {
            color: var(--muted);
            font-size: 11px;
        }

        .conversation {
            display: flex;
            min-height: calc(100vh - 104px);
            max-height: calc(100vh - 104px);
        }

        .conversation-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-width: 0;
        }

        .messages {
            flex: 1;
            overflow: auto;
            padding: 18px;
        }

        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
        }

        .message {
            display: flex;
            margin-bottom: 14px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(760px, 84%);
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            line-height: 1.65;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            border-color: #b8d5c1;
            background: #e8f4ec;
        }

        .bubble a {
            color: var(--teal);
            overflow-wrap: anywhere;
        }

        .message-image {
            display: block;
            max-width: min(360px, 100%);
            max-height: 260px;
            margin-top: 8px;
            border-radius: 6px;
            object-fit: contain;
        }

        .action-card {
            width: min(420px, 100%);
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #d5decf;
            border-radius: 6px;
            background: #f7fbf7;
        }

        .action-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .action-card-badge {
            color: var(--amber);
            font-size: 12px;
            white-space: nowrap;
        }

        .action-payload {
            margin: 0 0 9px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            min-height: 32px;
            padding: 5px 11px;
            border-radius: 6px;
            cursor: pointer;
        }

        .confirm-button {
            border: 0;
            background: var(--green);
            color: #fff;
        }

        .cancel-button {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
        }

        .composer-wrap {
            border-top: 1px solid var(--line);
            background: #fbfcfa;
            padding: 10px 12px 12px;
        }

        .preview {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .preview.visible {
            display: flex;
        }

        .preview img {
            width: 54px;
            height: 54px;
            border-radius: 6px;
            object-fit: cover;
        }

        .composer-wrap .icon-button {
            border-color: var(--line);
            color: var(--red);
            background: #fff;
        }

        .composer {
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr) 44px;
            gap: 8px;
            align-items: end;
        }

        .composer .tool-button {
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--green);
            cursor: pointer;
            font-size: 19px;
        }

        .composer textarea {
            min-height: 40px;
            max-height: 128px;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            resize: vertical;
        }

        .composer textarea:focus,
        .top-select:focus,
        .tool-button:focus,
        .icon-button:focus {
            outline: 2px solid #79a994;
            outline-offset: 1px;
        }

        .send {
            width: 44px;
            height: 40px;
            border: 0;
            border-radius: 6px;
            background: var(--green);
            color: #fff;
            cursor: pointer;
            font-size: 17px;
        }

        .send:disabled {
            background: #98a99d;
            cursor: not-allowed;
        }

        .trace-list {
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 500px);
            min-height: 150px;
            overflow: auto;
            padding: 8px;
        }

        .trace {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            background: #fff;
        }

        .trace-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 700;
        }

        .trace-status {
            color: var(--green);
            font-size: 12px;
        }

        .trace-status.error {
            color: var(--red);
        }

        .trace pre {
            max-height: 180px;
            margin: 7px 0 0;
            overflow: auto;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .session-detail {
            padding: 10px 12px;
            color: var(--muted);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .notice {
            margin: 0;
            padding: 9px 12px;
            border-bottom: 1px solid #ecd3b2;
            background: #fff5e4;
            color: var(--amber);
            font-size: 13px;
        }

        .files {
            display: grid;
            gap: 8px;
            padding: 8px;
        }

        .files img {
            width: 100%;
            border-radius: 6px;
            border: 1px solid var(--line);
            object-fit: cover;
        }

        .loading {
            position: relative;
        }

        .loading::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.68);
        }

        @media (max-width: 1050px) {
            .workspace {
                grid-template-columns: 220px minmax(0, 1fr);
            }

            .side-column.context {
                display: none;
            }

            .conversation {
                min-height: calc(100vh - 104px);
            }
        }

        @media (max-width: 720px) {
            .topbar {
                position: static;
                flex-wrap: wrap;
                padding: 10px 12px;
            }

            .brand {
                width: 100%;
            }

            .top-select {
                width: min(100%, 230px);
            }

            .workspace {
                grid-template-columns: minmax(0, 1fr);
                width: calc(100% - 16px);
            }

            .subject-list {
                max-height: 190px;
            }

            .conversation {
                min-height: 66vh;
                max-height: none;
            }

            .messages {
                min-height: 300px;
            }

            .bubble {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>
<header class="topbar">
    <button class="icon-button" id="homeButton" title="返回首页" type="button">&#8592;</button>
    <div class="brand">
        <strong>WECHATILINK Agent</strong>
        <span id="authName">未登录</span>
    </div>
    <select class="top-select" id="subjectSelect" aria-label="护理对象"></select>
    <button class="icon-button" id="newConversation" title="新会话" type="button">&#8634;</button>
</header>

<main class="workspace">
    <aside class="side-column">
        <section class="panel">
            <div class="panel-head">护理对象</div>
            <div class="subject-list" id="subjects"></div>
            <form class="subject-form" id="subjectForm" hidden>
                <select id="newSubjectType" aria-label="类型">
                    <option value="PET">宠物</option>
                    <option value="PLANT">植物</option>
                </select>
                <input id="newSubjectName" placeholder="名字" required maxlength="50">
                <input id="newSubjectSpecies" placeholder="品种（选填）" maxlength="50">
                <div class="action-buttons">
                    <button class="confirm-button" type="submit">保存档案</button>
                    <button class="cancel-button" type="button" id="cancelSubject">取消</button>
                </div>
            </form>
            <button class="add-subject" id="addSubject" type="button">＋ 新建档案</button>
        </section>
        <section class="panel">
            <div class="panel-head">历史会话</div>
            <div class="subject-list" id="conversations"><div class="empty">暂无会话</div></div>
        </section>
    </aside>

    <section class="panel conversation">
        <div class="conversation-body">
            <div class="messages" id="messages">
                <div class="empty" id="emptyState">暂无消息</div>
            </div>
            <form class="composer-wrap" id="composer">
                <div class="preview" id="imagePreview">
                    <img id="previewImage" alt="待发送图片">
                    <button class="icon-button dark" id="removeImage" title="移除图片" type="button">&#10005;</button>
                </div>
                <div class="composer">
                    <label class="tool-button" for="imageInput" title="上传图片">+</label>
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <textarea id="messageInput" rows="1" placeholder="输入消息"></textarea>
                    <button class="send" id="sendButton" title="发送" type="submit">&#10148;</button>
                </div>
            </form>
        </div>
    </section>

    <aside class="side-column context">
        <section class="panel">
            <div class="panel-head">护理记录</div>
            <div class="record-list" id="subjectRecords"><div class="empty">选择对象后显示</div></div>
        </section>
        <section class="panel">
            <div class="panel-head">执行轨迹</div>
            <div class="trace-list" id="traceList">
                <div class="empty">暂无调用</div>
            </div>
        </section>
        <section class="panel">
            <div class="panel-head">生成结果</div>
            <div class="files" id="files"></div>
        </section>
        <section class="panel">
            <div class="panel-head">会话</div>
            <div class="session-detail" id="sessionDetail">-</div>
        </section>
    </aside>
</main>

<script>
const state = {
    subjects: [],
    selectedSubjectId: null,
    artifactId: null,
    artifactUrl: null,
    uploading: false,
    conversationId: null,
    conversations: [],
    sending: false
};

const CONVERSATION_KEY = 'agentConversationId';

const messages = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const subjectSelect = document.getElementById('subjectSelect');
const subjects = document.getElementById('subjects');
const messageInput = document.getElementById('messageInput');
const imageInput = document.getElementById('imageInput');
const imagePreview = document.getElementById('imagePreview');
const previewImage = document.getElementById('previewImage');
const sendButton = document.getElementById('sendButton');
const traceList = document.getElementById('traceList');
const files = document.getElementById('files');
const sessionDetail = document.getElementById('sessionDetail');
const authName = document.getElementById('authName');

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function linkify(value) {
    return escapeHtml(value).replace(/(https?:\/\/[^\s<]+)/g, url =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

function scrollMessages() {
    messages.scrollTop = messages.scrollHeight;
}

function addMessage(role, content, imageUrl) {
    emptyState.style.display = 'none';
    const item = document.createElement('div');
    item.className = `message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = role === 'user' ? escapeHtml(content) : linkify(content);
    if (imageUrl) {
        const image = document.createElement('img');
        image.className = 'message-image';
        image.src = imageUrl;
        image.alt = '用户上传图片';
        bubble.appendChild(image);
    }
    item.appendChild(bubble);
    messages.appendChild(item);
    scrollMessages();
    return item;
}

function renderSubjects() {
    subjects.innerHTML = '';
    subjectSelect.innerHTML = '<option value="">全部对象</option>';
    state.subjects.forEach(subject => {
        const option = document.createElement('option');
        option.value = String(subject.id);
        option.textContent = `${subject.type === 'PET' ? '宠物' : '植物'} · ${subject.name}`;
        subjectSelect.appendChild(option);

        const row = document.createElement('div');
        row.className = 'subject-row';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = `subject${subject.id === state.selectedSubjectId ? ' active' : ''}`;
        button.innerHTML = `
            <span class="subject-icon">${escapeHtml(subject.name.slice(0, 1).toUpperCase())}</span>
            <span>
                <span class="subject-name">${escapeHtml(subject.name)}</span>
                <span class="subject-meta">${subject.type === 'PET' ? '宠物' : '植物'} · ${escapeHtml(subject.species || '未填写品种')}</span>
            </span>`;
        button.addEventListener('click', () => selectSubject(subject.id));
        row.appendChild(button);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'subject-remove';
        remove.title = '删除档案';
        remove.textContent = '×';
        remove.addEventListener('click', event => {
            event.stopPropagation();
            deleteSubject(subject);
        });
        row.appendChild(remove);

        subjects.appendChild(row);
    });
}

async function deleteSubject(subject) {
    if (!window.confirm(`删除档案「${subject.name}」？相关对话记录会保留。`)) return;
    try {
        const response = await fetch(`/api/agent/subjects/${subject.id}`, {method: 'DELETE'});
        if (response.status === 401) {
            location.href = '/login';
            return;
        }
        if (!response.ok) throw new Error('档案删除失败');
        if (state.selectedSubjectId === subject.id) {
            state.selectedSubjectId = null;
            subjectSelect.value = '';
        }
        await loadSubjects();
        renderSubjectRecords([]);
    } catch (error) {
        addMessage('assistant', `档案删除失败：${error.message}`);
    }
}

function selectSubject(id) {
    state.selectedSubjectId = id;
    subjectSelect.value = id ? String(id) : '';
    renderSubjects();
    if (id) {
        loadSubjectRecords(id);
    } else {
        renderSubjectRecords([]);
    }
}

async function loadSubjectRecords(subjectId) {
    try {
        const response = await fetch(`/api/agent/subjects/${subjectId}/records`);
        if (!response.ok) {
            renderSubjectRecords([]);
            return;
        }
        renderSubjectRecords(await response.json());
    } catch (error) {
        renderSubjectRecords([]);
    }
}

const RECORD_TYPE_LABELS = {
    MEDICATION: '用药', VITALS: '体征', SYMPTOM: '症状观察', DIAGNOSIS: '诊断',
    ADVICE: '建议', REMINDER: '提醒', CARE: '日常护理'
};

function renderSubjectRecords(records) {
    const list = document.getElementById('subjectRecords');
    if (!list) return;
    list.innerHTML = '';
    if (!records?.length) {
        list.innerHTML = '<div class="empty">暂无护理记录</div>';
        return;
    }
    records.forEach(record => {
        const item = document.createElement('div');
        item.className = 'record-item';
        item.innerHTML = `
            <div class="record-type">${escapeHtml(RECORD_TYPE_LABELS[record.recordType] || record.recordType)} · ${escapeHtml(formatTime(record.createdAt))}</div>
            <div class="record-content">${escapeHtml(record.content || record.title || '-')}</div>`;
        list.appendChild(item);
    });
}

async function loadIdentity() {
    const response = await fetch('/api/auth/me');
    const result = await response.json();
    if (result.code !== 200) {
        location.href = '/login';
        return;
    }
    authName.textContent = result.data.userName;
}

async function loadSubjects() {
    const response = await fetch('/api/agent/subjects');
    if (response.status === 401) {
        location.href = '/login';
        return;
    }
    if (!response.ok) throw new Error('护理对象加载失败');
    state.subjects = await response.json();
    renderSubjects();
}

function resetImage() {
    state.artifactId = null;
    state.artifactUrl = null;
    imageInput.value = '';
    imagePreview.classList.remove('visible');
}

async function newConversation() {
    const response = await fetch('/api/agent/conversations/new', {method: 'POST'});
    if (!response.ok) throw new Error('会话创建失败');
    const result = await response.json();
    state.conversationId = result.conversationId;
    localStorage.setItem(CONVERSATION_KEY, state.conversationId);
    messages.innerHTML = '';
    messages.appendChild(emptyState);
    emptyState.style.display = 'flex';
    traceList.innerHTML = '<div class="empty">暂无调用</div>';
    files.innerHTML = '';
    sessionDetail.textContent = state.conversationId;
    resetImage();
    renderConversations();
}

async function loadConversations() {
    const response = await fetch('/api/agent/conversations');
    if (response.status === 401) {
        location.href = '/login';
        return;
    }
    if (!response.ok) return;
    state.conversations = await response.json();
    renderConversations();
}

function renderConversations() {
    const list = document.getElementById('conversations');
    if (!list) return;
    list.innerHTML = '';
    if (!state.conversations.length) {
        list.innerHTML = '<div class="empty">暂无会话</div>';
        return;
    }
    state.conversations.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `subject${item.conversationId === state.conversationId ? ' active' : ''}`;
        button.innerHTML = `
            <span class="subject-icon">${escapeHtml((item.summary || '会话').slice(0, 1).toUpperCase())}</span>
            <span>
                <span class="subject-name">${escapeHtml(item.summary || '新会话')}</span>
                <span class="subject-meta">${escapeHtml(formatTime(item.updatedAt))}</span>
            </span>`;
        button.addEventListener('click', () => openConversation(item.conversationId));
        list.appendChild(button);
    });
}

function formatTime(iso) {
    if (!iso) return '';
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return '';
    const pad = value => String(value).padStart(2, '0');
    return `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

async function openConversation(conversationId) {
    const response = await fetch(`/api/agent/conversations/${conversationId}/messages`);
    if (response.status === 401) {
        location.href = '/login';
        throw new Error('未登录');
    }
    if (!response.ok) throw new Error('会话加载失败');
    const history = await response.json();

    state.conversationId = conversationId;
    localStorage.setItem(CONVERSATION_KEY, conversationId);
    messages.innerHTML = '';
    messages.appendChild(emptyState);
    emptyState.style.display = history.length ? 'none' : 'flex';
    history.forEach(item => {
        addMessage(item.role, item.content,
            item.artifactId ? `/api/agent/artifacts/${item.artifactId}/content` : null);
    });
    sessionDetail.textContent = conversationId;
    resetImage();
    renderConversations();
    await refreshTraces(conversationId);
}

async function refreshTraces(conversationId) {
    try {
        const response = await fetch(`/api/agent/traces/${conversationId}`);
        if (!response.ok) {
            renderTrace([]);
            return;
        }
        renderTrace(await response.json());
    } catch (error) {
        renderTrace([]);
    }
}

function renderTrace(history) {
    traceList.innerHTML = '';
    if (!history?.length) {
        traceList.innerHTML = '<div class="empty">暂无调用</div>';
        return;
    }
    history.forEach(call => {
        // 消息响应返回 toolCallHistory（success 布尔），traces API 返回 status 字符串
        const ok = call.success ?? call.status === 'SUCCESS';
        const item = document.createElement('div');
        item.className = 'trace';
        item.innerHTML = `
            <div class="trace-top">
                <span>${escapeHtml(call.toolName)}</span>
                <span class="trace-status${ok ? '' : ' error'}">${ok ? '成功' : '失败'} · ${call.durationMs}ms</span>
            </div>
            <pre>参数：${escapeHtml(JSON.stringify(call.arguments ?? {}, null, 2))}
结果：${escapeHtml(call.result || call.errorMessage || '-')}</pre>`;
        traceList.appendChild(item);
    });
}

function renderFiles(urls) {
    files.innerHTML = '';
    (urls || []).forEach(url => {
        const image = document.createElement('img');
        image.src = url;
        image.alt = '生成图片';
        files.appendChild(image);
    });
}

function appendCards(parent, cards) {
    (cards || []).forEach(card => {
        const item = document.createElement('div');
        item.className = 'action-card';
        item.innerHTML = `
            <div class="action-card-head">
                <span>${escapeHtml(card.title)}</span>
                <span class="action-card-badge">待确认</span>
            </div>
            <pre class="action-payload">${escapeHtml(formatPayload(card.payload))}</pre>
            <div class="action-buttons">
                <button class="confirm-button" type="button">确认执行</button>
                <button class="cancel-button" type="button">取消</button>
            </div>`;
        const buttons = item.querySelectorAll('button');
        buttons[0].addEventListener('click', () => resolveAction(card, buttons[0], 'confirm'));
        buttons[1].addEventListener('click', () => resolveAction(card, buttons[1], 'cancel'));
        parent.appendChild(item);
    });
}

function formatPayload(payload) {
    const lines = [];
    Object.entries(payload || {}).forEach(([key, value]) => {
        if (key === 'confirmationId' || key === 'toolName' || key === 'expiresAt') return;
        lines.push(`${key}: ${value}`);
    });
    return lines.join('\n') || '无附加参数';
}

async function resolveAction(card, button, action) {
    const id = card.payload?.confirmationId;
    if (!id || button.disabled) return;
    button.disabled = true;
    button.textContent = '处理中...';
    try {
        const response = await fetch(`/api/agent/confirmations/${id}/${action}`, {method: 'POST'});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '操作失败');
        const message = document.createElement('div');
        message.className = 'message assistant';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = result.reply || '操作完成';
        message.appendChild(bubble);
        messages.appendChild(message);
        scrollMessages();
        const cardNode = button.closest('.action-card');
        if (cardNode) {
            cardNode.querySelector('.action-card-badge').textContent = result.status || '已处理';
            cardNode.querySelector('.action-buttons').remove();
        }
        // 确认执行可能新建了档案/记录（createCareSubject、saveCareRecord 等），刷新侧栏
        loadSubjects();
        if (state.selectedSubjectId) {
            loadSubjectRecords(state.selectedSubjectId);
        }
    } catch (error) {
        button.disabled = false;
        button.textContent = action === 'confirm' ? '确认执行' : '取消';
        addMessage('assistant', `确认操作失败：${error.message}`);
    }
}

async function sendMessage(event) {
    event.preventDefault();
    if (state.sending) return;
    const text = messageInput.value.trim();
    if (state.uploading) return;
    if (!text && !state.artifactId) return;

    const artifactId = state.artifactId;
    const artifactUrl = state.artifactUrl;
    addMessage('user', text || '[图片]', artifactUrl);
    messageInput.value = '';
    resetImage();
    state.sending = true;
    sendButton.disabled = true;

    const selected = state.subjects.find(subject => subject.id === state.selectedSubjectId);
    try {
        const response = await fetch('/api/agent/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                conversationId: state.conversationId,
                message: text || '请分析这张图片',
                artifactId,
                subjectType: selected?.type,
                subjectId: selected?.id
            })
        });
        const result = await response.json();
        if (response.status === 401) {
            location.href = '/login';
            return;
        }
        if (!response.ok || !result.success) {
            throw new Error(result.error || '发送失败');
        }
        state.conversationId = result.conversationId;
        localStorage.setItem(CONVERSATION_KEY, result.conversationId);
        sessionDetail.textContent = result.conversationId;
        const assistant = addMessage('assistant', result.reply || '未返回内容');
        appendCards(assistant.querySelector('.bubble'), result.cards);
        renderTrace(result.toolCallHistory);
        renderFiles(result.generatedFiles);
        loadConversations();
    } catch (error) {
        addMessage('assistant', `处理失败：${error.message}`);
    } finally {
        state.sending = false;
        sendButton.disabled = false;
    }
}

document.getElementById('composer').addEventListener('submit', sendMessage);
document.getElementById('homeButton').addEventListener('click', () => location.href = '/home');
document.getElementById('newConversation').addEventListener('click', newConversation);
subjectSelect.addEventListener('change', () => selectSubject(Number(subjectSelect.value) || null));

const subjectForm = document.getElementById('subjectForm');
document.getElementById('addSubject').addEventListener('click', () => {
    subjectForm.hidden = false;
    document.getElementById('newSubjectName').focus();
});
document.getElementById('cancelSubject').addEventListener('click', () => {
    subjectForm.hidden = true;
    subjectForm.reset();
});
subjectForm.addEventListener('submit', async event => {
    event.preventDefault();
    const body = {
        subjectType: document.getElementById('newSubjectType').value,
        name: document.getElementById('newSubjectName').value.trim(),
        species: document.getElementById('newSubjectSpecies').value.trim()
    };
    if (!body.name) return;
    try {
        const response = await fetch('/api/agent/subjects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        if (response.status === 401) {
            location.href = '/login';
            return;
        }
        if (!response.ok) {
            const result = await response.json().catch(() => ({}));
            throw new Error(result.error || '档案创建失败');
        }
        const created = await response.json();
        subjectForm.hidden = true;
        subjectForm.reset();
        await loadSubjects();
        selectSubject(created.id);
    } catch (error) {
        addMessage('assistant', `档案创建失败：${error.message}`);
    }
});
document.getElementById('removeImage').addEventListener('click', resetImage);
messageInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.getElementById('composer').requestSubmit();
    }
});

imageInput.addEventListener('change', event => {
    const file = event.target.files?.[0];
    if (!file) return;
    uploadArtifact(file);
});

async function uploadArtifact(file) {
    state.uploading = true;
    imageInput.disabled = true;
    try {
        const body = new FormData();
        body.append('file', file);
        const response = await fetch('/api/agent/artifacts', {method: 'POST', body});
        const result = await response.json();
        if (response.status === 401) {
            location.href = '/login';
            return;
        }
        if (!response.ok) throw new Error(result.error || '图片上传失败');
        state.artifactId = result.artifactId;
        state.artifactUrl = result.url;
        previewImage.src = result.url;
        imagePreview.classList.add('visible');
    } catch (error) {
        addMessage('assistant', `图片上传失败：${error.message}`);
        resetImage();
    } finally {
        state.uploading = false;
        imageInput.disabled = false;
    }
}

Promise.all([loadIdentity(), loadSubjects()]).then(async () => {
    await loadConversations();
    const stored = localStorage.getItem(CONVERSATION_KEY);
    if (stored) {
        try {
            await openConversation(stored);
            return;
        } catch (error) {
            // 存储的会话已失效（过期/不属于当前用户），回退新建
        }
    }
    await newConversation();
}).catch(error => {
    authName.textContent = error.message;
});
</script>
</body>
